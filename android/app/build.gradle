apply plugin: 'com.android.application'

def webModeFile = file('src/main/assets/public/ad-build.json')
def webMode = webModeFile.exists() ? new groovy.json.JsonSlurper().parse(webModeFile) : [:]

android {
    namespace = "com.fajar.dawnbound"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.fajar.dawnbound"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode((webMode.versionCode ?: 8) as int)
        versionName(webMode.versionName ?: "1.0.7")
        manifestPlaceholders = [admobAppId: '@string/admob_app_id', appLabel: '@string/app_name']
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Upload key lives outside the project (E:/DawnboundKeys); override with DAWNBOUND_KEYSTORE_PROPS.
    def keyProps = new Properties()
    def keyPropsFile = file(System.getenv('DAWNBOUND_KEYSTORE_PROPS') ?: 'E:/DawnboundKeys/keystore.properties')
    if (keyPropsFile.exists()) keyPropsFile.withInputStream { keyProps.load(it) }
    signingConfigs {
        release {
            if (keyProps['storeFile']) {
                storeFile file(keyProps['storeFile'])
                storePassword keyProps['storePassword']
                keyAlias keyProps['keyAlias']
                keyPassword keyProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (keyProps['storeFile']) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        adTest {
            initWith release
            debuggable true
            applicationIdSuffix '.adtest'
            versionNameSuffix '-qa'
            matchingFallbacks = ['release']
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Google Play Games Services v2: cloud save (Saved Games), achievements, leaderboards (PlayGamesPlugin.java).
    implementation "com.google.android.gms:play-services-games-v2:21.0.0"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Release packages always use the normal game UI and the registered publisher App ID.
// QA hooks are restricted to the separate, debuggable QA package.
tasks.configureEach { task ->
    if (task.name in ['preReleaseBuild', 'preDebugBuild', 'preAdTestBuild']) {
        task.doFirst {
            def modeFile = file('src/main/assets/public/ad-build.json')
            if (!modeFile.exists()) throw new GradleException('Run android:sync or android:adtest:sync first.')
            def mode = new groovy.json.JsonSlurper().parse(modeFile)
            if ((task.name == 'preReleaseBuild' && mode.qa) || (task.name == 'preAdTestBuild' && !mode.qa)) {
                throw new GradleException('QA hooks do not match this Android build. Sync the matching mode first.')
            }
            if (!(mode.versionCode instanceof Number) || mode.versionCode <= 0 || !mode.versionName) {
                throw new GradleException('Build version is missing. Sync the matching build profile first.')
            }
        }
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
